<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MÀY CHAN BỐ MÀY ĐI.IO</title>
    <style>
        body { margin: 0; padding: 0; background-color: #0b0c10; overflow: hidden; touch-action: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; }
        canvas { display: block; }
        #ui { position: absolute; top: 15px; left: 15px; font-size: clamp(16px, 4vw, 24px); font-weight: bold; pointer-events: none; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); display: none; z-index: 10; }
        #boost-container { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; height: 24px; background: rgba(0,0,0,0.8); border: 2px solid #34495e; border-radius: 12px; display: none; z-index: 10; overflow: hidden; }
        #boost-bar { width: 0%; height: 100%; background: #2ecc71; transition: width 0.2s; }
        #leaderboard { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 10px; border: 2px solid #0f3460; display: none; z-index: 10; width: 140px; pointer-events: none; }
        #menu-screen, #game-over-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100%; display: flex; flex-direction: column; align-items: center; z-index: 20; padding: 20px; box-sizing: border-box; overflow-y: auto; background: radial-gradient(circle, #2c3e50, #0b0c10); }
        #game-over-screen { display: none; background: rgba(0,0,0,0.9); justify-content: center; }
        .setup-box { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px; width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 10px; backdrop-filter: blur(10px); }
        input, select, .btn { width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #3498db; background: rgba(0,0,0,0.5); color: white; font-weight: bold; box-sizing: border-box; text-align: center; outline: none; }
        .start-btn { background: linear-gradient(45deg, #e94560, #c0392b); border: none; font-size: 24px; padding: 15px; cursor: pointer; border-radius: 50px; margin-top: 10px; }
        #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; display: none; }
        #joystick-base { width: 100%; height: 100%; background: rgba(255,255,255,0.1); border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); position: relative; }
        #joystick-knob { width: 50px; height: 50px; background: #3498db; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        #mobile-controls { position: absolute; bottom: 30px; right: 30px; display: none; gap: 10px; }
        .action-btn { width: 60px; height: 60px; border-radius: 50%; background: rgba(0,0,0,0.6); border: 2px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    </style>
</head>
<body>
    <div id="ui">Điểm: <span id="score">0</span></div>
    <div id="boost-container"><div id="boost-bar"></div></div>
    <div id="leaderboard"><h3>BXH</h3><div id="lb-content"></div></div>

    <div id="joystick-zone"><div id="joystick-base"><div id="joystick-knob"></div></div></div>
    <div id="mobile-controls">
        <div class="action-btn" id="btn-fire">🔥</div>
        <div class="action-btn" id="btn-dash">⚡</div>
    </div>

    <div id="menu-screen">
        <h1 style="color:#e94560; font-size: 40px;">MÀY CHAN BỐ MÀY ĐI</h1>
        <div class="setup-box">
            <input type="text" id="player-name" value="Player">
            <input type="text" id="cheat-input" placeholder="MÃ HACK (NẾU CÓ)...">
            <select id="diff-select" onchange="document.getElementById('more-modes').style.display=(this.value==='more'?'block':'none')">
                <option value="1">Dễ (Gà Mờ)</option>
                <option value="2">Khó (Chiến Trường)</option>
                <option value="3">ĐỨC VIPPRO 🔥</option>
                <option value="more">--- More ---</option>
            </select>
            <select id="more-modes" style="display:none; border-color:#ff9ff3;"><option value="trang">👑 Hoàng Mai Trang</option></select>
            <button class="start-btn" onclick="startGame()">VÀO ĐỜI</button>
        </div>
    </div>

    <div id="game-over-screen">
        <h1 id="death-title">CHẾT NHĂN RĂNG!</h1>
        <p id="death-text" style="color:#f1c40f; font-size:20px; text-align:center;"></p>
        <button class="start-btn" onclick="location.reload()">LÀM LẠI CUỘC ĐỜI</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d');
        const bgm = new Audio('bgm.mp3'); bgm.loop = true; bgm.volume = 0.2;
        const killSounds = ['kill1.mp3', 'kill2.mp3', 'kill3.mp3', 'kill4.mp3', 'kill5.mp3'];
        function playSFX(s, v=1.0) { let a = new Audio(s); a.volume = v; a.play().catch(()=>{}); }

        const wallTaunts = ["Mù à đâm tường? Thay kính đi em!", "Tường ngon không? Nhai kỹ vào!", "Bố mẹ cho ăn học để đi đâm tường à?", "Mắt để ở mông hay sao mà lái thế?"];
        const killTaunts = ["Bị {name} vả cho sang chấn tâm lý!", "Quỳ xuống gọi {name} là bố đi con!", "Trình này đi chăn vịt đi, tuổi gì với {name}!"];

        let player, bots = [], foods = [], projectiles = [], floatingTexts = [];
        let gameState = 'menu', worldSize = 3000, camera = {x:0, y:0}, zoom = 1, shake = 0, shakeMag = 0, isCheat = false;

        class Snake {
            constructor(name, isP, x, y, color, emoji) {
                this.name = name; this.isP = isP; this.x = x; this.y = y; this.color = color; this.emoji = emoji;
                this.score = 50; this.size = 15; this.angle = Math.random()*Math.PI*2; this.segments = [];
                this.hp = 100; this.maxHp = 100; this.speed = 5; this.dash = 0;
                for(let i=0; i<10; i++) this.segments.push({x:x, y:y});
            }
            update() {
                this.size = 15 + Math.sqrt(this.score)*0.4;
                let s = (this.dash > 0 ? 12 : 5) * (this.isP && isCheat ? 1.5 : 1);
                this.x += Math.cos(this.angle) * s; this.y += Math.sin(this.angle) * s;
                this.segments.unshift({x: this.x, y: this.y});
                if(this.segments.length > this.score/5 + 5) this.segments.pop();
                if(this.dash > 0) this.dash--;
                if(this.hp < this.maxHp) this.hp += 0.1;
            }
        }

        function spawnBot() { bots.push(new Snake("Bot "+bots.length, false, (Math.random()-0.5)*worldSize, (Math.random()-0.5)*worldSize, "hsl("+Math.random()*360+",70%,50%)", "🐍")); }
        function spawnFood() { foods.push({x:(Math.random()-0.5)*worldSize, y:(Math.random()-0.5)*worldSize, s:Math.random()*5+5, c:"hsl("+Math.random()*360+",80%,60%)"}); }

        function startGame() {
            isCheat = document.getElementById('cheat-input').value.toLowerCase() === "ducdeptrais1tg";
            player = new Snake(document.getElementById('player-name').value, true, 0, 0, "#3498db", "😎");
            for(let i=0; i<40; i++) spawnBot();
            for(let i=0; i<400; i++) spawnFood();
            document.getElementById('menu-screen').style.display='none';
            document.getElementById('ui').style.display='block';
            if(isTouchDevice) { document.getElementById('joystick-zone').style.display='block'; document.getElementById('mobile-controls').style.display='flex'; }
            bgm.play().catch(()=>{}); gameState = 'playing';
        }

        const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        let joyActive = false, joyDir = {x:0, y:0};
        
        // Joystick Logic
        document.getElementById('joystick-zone').ontouchstart = (e) => { joyActive = true; };
        window.ontouchmove = (e) => {
            if(!joyActive) return;
            let touch = e.touches[0]; let rect = document.getElementById('joystick-base').getBoundingClientRect();
            let dx = touch.clientX - (rect.left + 60), dy = touch.clientY - (rect.top + 60);
            let dist = Math.sqrt(dx*dx+dy*dy);
            joyDir = {x: dx/dist, y: dy/dist};
            let k = document.getElementById('joystick-knob');
            let lim = Math.min(dist, 40);
            k.style.left = 50 + (dx/dist*lim)*0.8 + '%'; k.style.top = 50 + (dy/dist*lim)*0.8 + '%';
            player.angle = Math.atan2(dy, dx);
        };
        window.ontouchend = () => { joyActive = false; document.getElementById('joystick-knob').style.left='50%'; document.getElementById('joystick-knob').style.top='50%'; };

        // Keyboard & Mouse
        window.onmousemove = (e) => { if(!isTouchDevice && player) player.angle = Math.atan2(e.clientY - canvas.height/2, e.clientX - canvas.width/2); };
        window.onkeydown = (e) => { 
            if(e.code === 'Space') player.dash = 20; 
            if(e.key === 'q') shoot(player);
        };
        document.getElementById('btn-fire').ontouchstart = () => shoot(player);
        document.getElementById('btn-dash').ontouchstart = () => player.dash = 20;

        function shoot(s) {
            if(s.score < 100 && !isCheat) return;
            if(!isCheat) s.score -= 100;
            if(s.isP) playSFX('shoot.mp3', 1.0);
            projectiles.push({x: s.x, y: s.y, a: s.angle, owner: s, life: 100});
        }

        function loop() {
            requestAnimationFrame(loop);
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            if(gameState !== 'playing') return;

            player.update();
            camera.x = player.x; camera.y = player.y;
            
            // Xử lý va chạm food
            foods.forEach((f, i) => {
                if(Math.hypot(player.x-f.x, player.y-f.y) < player.size + f.s) { player.score += 5; foods.splice(i,1); spawnFood(); scoreEl.innerText = player.score; }
            });

            // Xử lý đạn
            projectiles.forEach((p, i) => {
                p.x += Math.cos(p.a)*20; p.y += Math.sin(p.a)*20; p.life--;
                bots.forEach(b => {
                    if(Math.hypot(p.x-b.x, p.y-b.y) < b.size + 10) {
                        b.hp -= 40; p.life = 0;
                        if(b.hp <= 0) {
                            b.dead = true; playSFX(killSounds[Math.floor(Math.random()*5)], 1.0);
                            player.score += 200; shake = 15; shakeMag = 15;
                        }
                    }
                });
                if(p.life <= 0) projectiles.splice(i, 1);
            });

            // Check chết đâm tường
            if(Math.abs(player.x) > worldSize/2 || Math.abs(player.y) > worldSize/2) die(null);

            draw();
        }

        function die(killer) {
            gameState = 'over';
            document.getElementById('game-over-screen').style.display='flex';
            document.getElementById('death-text').innerText = killer ? killTaunts[0].replace("{name}", killer) : wallTaunts[Math.floor(Math.random()*wallTaunts.length)];
            bgm.pause(); playSFX('die.mp3', 1.0);
        }

        function draw() {
            ctx.fillStyle = '#0b0c10'; ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.save();
            if(shake > 0) { ctx.translate((Math.random()-0.5)*shakeMag, (Math.random()-0.5)*shakeMag); shake--; }
            ctx.translate(canvas.width/2 - camera.x, canvas.height/2 - camera.y);

            // Vẽ tường
            ctx.strokeStyle = '#e94560'; ctx.lineWidth = 10; ctx.strokeRect(-worldSize/2, -worldSize/2, worldSize, worldSize);

            // Vẽ Food
            foods.forEach(f => { ctx.fillStyle = f.c; ctx.beginPath(); ctx.arc(f.x, f.y, f.s, 0, Math.PI*2); ctx.fill(); });

            // Vẽ Đạn
            projectiles.forEach(p => { ctx.fillStyle='#00ffff'; ctx.beginPath(); ctx.arc(p.x, p.y, 8, 0, Math.PI*2); ctx.fill(); });

            // Vẽ Rắn
            [...bots, player].forEach(s => {
                if(s.dead) return;
                s.segments.forEach((seg, i) => {
                    ctx.fillStyle = s.color; ctx.globalAlpha = 1 - (i/s.segments.length);
                    ctx.beginPath(); ctx.arc(seg.x, seg.y, s.size * (1-i/s.segments.length*0.5), 0, Math.PI*2); ctx.fill();
                });
                ctx.globalAlpha = 1;
                ctx.font = (s.size*1.5)+"px Arial"; ctx.textAlign='center';
                ctx.fillText(s.emoji, s.x, s.y + s.size/2);
                ctx.font = "14px Arial"; ctx.fillStyle='white'; ctx.fillText(s.name, s.x, s.y - s.size - 5);
            });
            ctx.restore();
        }
        loop();
    </script>
</body>
</html>
