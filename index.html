<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MÀY CHAN BỐ MÀY ĐI.IO</title>
    <style>
        body { margin: 0; padding: 0; background-color: #0b0c10; overflow: hidden; touch-action: none; font-family: 'Segoe UI', Tahoma, sans-serif; color: white; }
        canvas { display: block; }
        #ui { position: absolute; top: 15px; left: 15px; font-size: 24px; font-weight: bold; pointer-events: none; z-index: 10; display: none; }
        #boost-container { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); width: 80%; max-width: 400px; height: 20px; background: rgba(0,0,0,0.8); border: 2px solid #34495e; border-radius: 10px; display: none; z-index: 10; overflow: hidden; }
        #boost-bar { width: 0%; height: 100%; background: #2ecc71; }
        #leaderboard { position: absolute; top: 15px; right: 15px; background: rgba(0, 0, 0, 0.6); padding: 10px; border-radius: 10px; border: 2px solid #0f3460; display: none; z-index: 10; width: 140px; font-size: 13px; }
        #menu-screen, #game-over-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; background: radial-gradient(circle, #2c3e50, #0b0c10); padding: 20px; box-sizing: border-box; }
        #game-over-screen { display: none; background: rgba(0,0,0,0.95); }
        .setup-box { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px; width: 100%; max-width: 350px; display: flex; flex-direction: column; gap: 12px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #3498db; background: rgba(0,0,0,0.5); color: white; font-weight: bold; text-align: center; box-sizing: border-box; outline: none; }
        .start-btn { background: linear-gradient(45deg, #e94560, #c0392b); border: none; font-size: 22px; cursor: pointer; border-radius: 50px; transition: 0.2s; color: white; font-weight: 900; padding: 15px 40px; width: 100%; max-width: 350px; margin-top: 10px; display: block; text-align: center; }
        #joystick-zone { position: absolute; bottom: 40px; left: 40px; width: 100px; height: 100px; display: none; z-index: 15; }
        #joystick-base { width: 100%; height: 100%; background: rgba(255, 255, 255, 0.1); border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.3); position: relative; }
        #joystick-knob { width: 40px; height: 40px; background: #3498db; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 2px solid white; }
        #mobile-controls { position: absolute; bottom: 40px; right: 20px; display: none; gap: 15px; z-index: 15; }
        .action-btn { width: 65px; height: 65px; border-radius: 50%; background: rgba(0,0,0,0.6); border: 2px solid #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 24px; color: white; font-weight: bold; }
    </style>
</head>
<body>
    <div id="ui">Điểm: <span id="score">0</span></div>
    <div id="boost-container"><div id="boost-bar"></div></div>
    <div id="leaderboard"><h3>TOP CHIẾN THẦN</h3><div id="lb-content"></div></div>

    <div id="joystick-zone"><div id="joystick-base"><div id="joystick-knob"></div></div></div>
    <div id="mobile-controls">
        <div class="action-btn" id="btn-fire">🔥</div>
        <div class="action-btn" id="btn-dash">⚡</div>
    </div>

    <div id="menu-screen">
        <h1 style="color:#e94560; text-shadow: 0 0 15px #e94560; font-size: 40px;">MÀY CHAN BỐ MÀY ĐI</h1>
        <div class="setup-box">
            <input type="text" id="player-name" value="Đức Pro" maxlength="15">
            <input type="text" id="cheat-input" placeholder="MÃ HACK VIP...">
            <select id="diff-select" onchange="document.getElementById('more-modes').style.display=(this.value==='more'?'block':'none')">
                <option value="1">Độ khó: Gà Mờ</option>
                <option value="2">Độ khó: Chiến Trường</option>
                <option value="3">ĐỨC VIPPRO 🔥</option>
                <option value="more">--- More ---</option>
            </select>
            <select id="more-modes" style="display:none; border-color:#ff9ff3;"><option value="trang">👑 Hoàng Mai Trang</option></select>
            <button class="start-btn" onclick="startGame()">VÀO ĐỜI</button>
        </div>
    </div>

    <div id="game-over-screen">
        <h1 style="color:#ff4757;">CÚT !!!</h1>
        <p id="death-text" style="color: #f1c40f; font-weight: bold; text-align: center;"></p>
        <button class="start-btn" onclick="resetGame()">LÀM LẠI CUỘC ĐỜI</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d');
        const bgm = new Audio('bgm.mp3'); bgm.loop = true; bgm.volume = 0.1;
        const dieSFX = new Audio('die.mp3'); dieSFX.volume = 1.0;
        const killSounds = ['kill1.mp3', 'kill2.mp3', 'kill3.mp3', 'kill4.mp3', 'kill5.mp3'];
        function playSFX(src, vol = 1.0) { let s = new Audio(src); s.volume = vol; s.play().catch(()=>{}); }

        const botNames = ["Boy Phố", "Báo Thủ", "Lươn Chúa", "Đại Ca Mõm", "Chúa Tể Ăn Hôi", "Trẻ Trâu", "Simp Lỏ"];
        const wallTaunts = ["Mù à đâm tường?", "Tường ngon không sếp?", "Lái ngu vầy đi bộ đi.", "Phí cả cơm nước!"];
        const killTaunts = ["Bị {name} vả cho sang chấn!", "Quỳ xuống gọi {name} là bố!", "Trình này đi chăn vịt đi!"];

        let player, bots = [], foods = [], projectiles = [];
        let gameState = 'menu', worldSize = 3000, camera = {x:0, y:0}, shake = 0, shakeMag = 0, isCheat = false;
        const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

        class Snake {
            constructor(name, isP, x, y, color, emoji) {
                this.name = name; this.isP = isP; this.x = x; this.y = y; this.color = color; this.emoji = emoji;
                this.score = 60; this.size = 15; this.angle = Math.random()*Math.PI*2; this.segments = [];
                this.dash = 0; this.shootCD = 0;
                for(let i=0; i<20; i++) this.segments.push({x:x, y:y});
            }
            update() {
                this.size = 15 + Math.sqrt(this.score)*0.35;
                let speed = (this.dash > 0 ? 11 : 4.5) * (this.isP && isCheat ? 1.6 : 1);
                this.x += Math.cos(this.angle) * speed; this.y += Math.sin(this.angle) * speed;
                let head = {x: this.x, y: this.y};
                if(Math.hypot(head.x - this.segments[0].x, head.y - this.segments[0].y) > this.size*0.3) {
                    this.segments.unshift(head);
                    let targetLen = Math.floor(this.score/6) + 15;
                    while(this.segments.length > targetLen) this.segments.pop();
                }
                if(this.dash > 0) this.dash--; if(this.shootCD > 0) this.shootCD--;
            }
            draw() {
                this.segments.forEach((seg, i) => {
                    ctx.globalAlpha = 1 - (i/this.segments.length)*0.8; ctx.fillStyle = this.color;
                    ctx.beginPath(); ctx.arc(seg.x, seg.y, this.size * (1-i/this.segments.length*0.5), 0, Math.PI*2); ctx.fill();
                });
                ctx.globalAlpha = 1; ctx.font = (this.size*1.2)+"px Arial"; ctx.textAlign='center';
                ctx.fillText(this.emoji, this.x, this.y + this.size/2);
                ctx.font = "bold 12px Arial"; ctx.fillStyle='white'; ctx.fillText(this.name, this.x, this.y - this.size - 5);
            }
        }

        function startGame() {
            isCheat = document.getElementById('cheat-input').value.toLowerCase() === "ducdeptrais1tg";
            player = new Snake(document.getElementById('player-name').value || "Đức", true, 0, 0, "#3498db", "😎");
            bots = []; for(let i=0; i<35; i++) bots.push(new Snake(botNames[Math.floor(Math.random()*botNames.length)], false, (Math.random()-0.5)*worldSize, (Math.random()-0.5)*worldSize, "orange", "🐍"));
            foods = []; for(let i=0; i<300; i++) foods.push({x:(Math.random()-0.5)*worldSize, y:(Math.random()-0.5)*worldSize, s:Math.random()*5+5, c:"yellow"});
            document.getElementById('menu-screen').style.display='none';
            document.getElementById('ui').style.display='block';
            if(isTouch) { document.getElementById('joystick-zone').style.display='block'; document.getElementById('mobile-controls').style.display='flex'; }
            bgm.currentTime = 0; bgm.play().catch(()=>{}); gameState = 'playing';
        }

        function resetGame() { dieSFX.pause(); dieSFX.currentTime = 0; location.reload(); }

        function shoot(s) {
            if(s.shootCD > 0 && !isCheat) return;
            if(s.score < 100 && !isCheat) return;
            if(!isCheat) s.score -= 100; s.shootCD = isCheat ? 3 : 50;
            if(s.isP) playSFX('shoot.mp3', 1.0);
            projectiles.push({x: s.x, y: s.y, a: s.angle, owner: s, life: 80});
        }

        // Controls
        let joyActive = false, joyCenter = {x:0,y:0};
        joystickZone.addEventListener('touchstart', (e) => { e.preventDefault(); joyActive = true; let r = joystickZone.getBoundingClientRect(); joyCenter = {x:r.left+50, y:r.top+50}; }, {passive:false});
        window.addEventListener('touchmove', (e) => { if(!joyActive) return; let t = e.targetTouches[0]; let dx = t.clientX - joyCenter.x, dy = t.clientY - joyCenter.y, dist = Math.hypot(dx,dy); let lim = 35; if(dist>lim) {dx*=lim/dist; dy*=lim/dist;} joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`; player.angle = Math.atan2(dy, dx); }, {passive:false});
        window.addEventListener('touchend', () => { joyActive = false; joystickKnob.style.transform = 'translate(-50%,-50%)'; });
        window.onmousemove = (e) => { if(gameState==='playing') player.angle = Math.atan2(e.clientY - canvas.height/2, e.clientX - canvas.width/2); };
        window.onkeydown = (e) => { if(e.code==='Space') player.dash=20; if(e.key==='q') shoot(player); };
        document.getElementById('btn-fire').ontouchstart = () => shoot(player);
        document.getElementById('btn-dash').ontouchstart = () => player.dash=20;

        function loop() {
            requestAnimationFrame(loop);
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            if(gameState !== 'playing') return;
            player.update();
            camera.x = player.x; camera.y = player.y;

            bots.forEach(b => {
                b.update(); if(Math.random()<0.01) b.angle += (Math.random()-0.5);
                if(Math.hypot(player.x-b.x, player.y-b.y)<400 && Math.random()<0.01) shoot(b);
            });

            foods.forEach((f, i) => { if(Math.hypot(player.x-f.x, player.y-f.y) < player.size+f.s) { player.score+=10; foods.splice(i,1); foods.push({x:(Math.random()-0.5)*worldSize, y:(Math.random()-0.5)*worldSize, s:5, c:"yellow"}); document.getElementById('score').innerText = Math.floor(player.score); } });

            projectiles.forEach((p, i) => {
                p.x += Math.cos(p.a)*20; p.y += Math.sin(p.a)*20; p.life--;
                [player, ...bots].forEach(s => { if(s!==p.owner && !s.dead && Math.hypot(p.x-s.x, p.y-s.y)<s.size+10) { p.life=0; if(p.owner.isP) { s.dead=true; playSFX(killSounds[Math.floor(Math.random()*5)]); player.score+=400; shake=15; shakeMag=12; } else if(s.isP) die(p.owner.name); } });
                if(p.life<=0) projectiles.splice(i,1);
            });

            if(Math.abs(player.x)>worldSize/2 || Math.abs(player.y)>worldSize/2) die(null);
            draw();
        }

        function die(k) {
            gameState = 'over'; bgm.pause(); bgm.currentTime = 0; dieSFX.play().catch(()=>{});
            document.getElementById('game-over-screen').style.display='flex';
            document.getElementById('death-text').innerText = k ? killTaunts[0].replace("{name}", k) : wallTaunts[0];
        }

        function draw() {
            ctx.fillStyle = '#0b0c10'; ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.save();
            if(shake > 0) { ctx.translate((Math.random()-0.5)*shakeMag, (Math.random()-0.5)*shakeMag); shake--; }
            ctx.translate(canvas.width/2 - camera.x, canvas.height/2 - camera.y);
            ctx.strokeStyle = '#e94560'; ctx.lineWidth = 10; ctx.strokeRect(-worldSize/2, -worldSize/2, worldSize, worldSize);
            foods.forEach(f => { ctx.fillStyle=f.c; ctx.beginPath(); ctx.arc(f.x,f.y,f.s,0,Math.PI*2); ctx.fill(); });
            projectiles.forEach(p => { ctx.fillStyle='#00ffff'; ctx.beginPath(); ctx.arc(p.x,p.y,8,0,Math.PI*2); ctx.fill(); });
            [...bots, player].forEach(s => { if(!s.dead) s.draw(); });
            ctx.restore();
        }
        loop();
    </script>
</body>
</html>
