<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MÀY CHAN BỐ MÀY ĐI.IO</title>
    <style>
        body { margin: 0; padding: 0; background-color: #0b0c10; overflow: hidden; touch-action: none; font-family: 'Segoe UI', Tahoma, sans-serif; color: white; }
        canvas { display: block; }
        #ui { position: absolute; top: 15px; left: 15px; font-size: clamp(18px, 4vw, 24px); font-weight: bold; pointer-events: none; text-shadow: 2px 2px 4px #000; display: none; z-index: 10; }
        #boost-container { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); width: 80%; max-width: 400px; height: 20px; background: rgba(0,0,0,0.8); border: 2px solid #34495e; border-radius: 10px; display: none; z-index: 10; overflow: hidden; }
        #boost-bar { width: 0%; height: 100%; background: #2ecc71; transition: width 0.2s; }
        #leaderboard { position: absolute; top: 15px; right: 15px; background: rgba(0, 0, 0, 0.6); padding: 10px; border-radius: 10px; border: 2px solid #0f3460; display: none; z-index: 10; width: 140px; font-size: 13px; }
        #menu-screen, #game-over-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; background: radial-gradient(circle, #2c3e50, #0b0c10); padding: 20px; box-sizing: border-box; }
        #game-over-screen { display: none; background: rgba(0,0,0,0.95); }
        .setup-box { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px; width: 100%; max-width: 350px; display: flex; flex-direction: column; gap: 12px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        input, select, .btn-ui { width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #3498db; background: rgba(0,0,0,0.5); color: white; font-weight: bold; text-align: center; box-sizing: border-box; outline: none; }
        .start-btn { background: linear-gradient(45deg, #e94560, #c0392b); border: none; font-size: 22px; cursor: pointer; border-radius: 50px; transition: 0.2s; color: white; font-weight: 900; }
        #joystick-zone { position: absolute; bottom: 40px; left: 40px; width: 100px; height: 100px; display: none; z-index: 15; }
        #joystick-base { width: 100%; height: 100%; background: rgba(255, 255, 255, 0.1); border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.3); position: relative; }
        #joystick-knob { width: 40px; height: 40px; background: #3498db; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 2px solid white; }
        #mobile-controls { position: absolute; bottom: 40px; right: 20px; display: none; gap: 15px; z-index: 15; }
        .action-btn { width: 65px; height: 65px; border-radius: 50%; background: rgba(0,0,0,0.6); border: 2px solid #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 24px; color: white; font-weight: bold; }
        .action-btn span { font-size: 10px; }
    </style>
</head>
<body>
    <div id="ui">Điểm: <span id="score">0</span></div>
    <div id="boost-container"><div id="boost-bar"></div></div>
    <div id="leaderboard"><h3>TOP CHIẾN THẦN</h3><div id="lb-content"></div></div>

    <div id="joystick-zone"><div id="joystick-base"><div id="joystick-knob"></div></div></div>
    <div id="mobile-controls">
        <div class="action-btn" id="btn-fire">🔥<span>KHẠC</span></div>
        <div class="action-btn" id="btn-dash">⚡<span>LƯỚT</span></div>
    </div>

    <div id="menu-screen">
        <h1 style="color:#e94560; text-shadow: 0 0 15px #e94560; font-size: 40px;">MÀY CHAN BỐ MÀY ĐI</h1>
        <div class="setup-box">
            <input type="text" id="player-name" value="Đức Pro">
            <input type="text" id="cheat-input" placeholder="MÃ HACK VIP...">
            <select id="diff-select" onchange="document.getElementById('more-modes').style.display=(this.value==='more'?'block':'none')">
                <option value="1">Độ khó: Gà Mờ</option>
                <option value="2">Độ khó: Chiến Trường</option>
                <option value="3">ĐỘ KHÓ: ĐỨC VIPPRO 🔥</option>
                <option value="more">--- More ---</option>
            </select>
            <select id="more-modes" style="display:none; border-color:#ff9ff3;"><option value="trang">👑 Chế độ: Hoàng Mai Trang</option></select>
            <button class="start-btn" onclick="startGame()">VÀO ĐỜI</button>
        </div>
    </div>

    <div id="game-over-screen">
        <h1 style="font-size: 45px; color:#ff4757;">CÚT !!!</h1>
        <p id="death-text" style="color:#f1c40f; font-weight:bold; text-align:center; font-size: 20px;"></p>
        <p>Kinh nghiệm: <span id="final-score" style="color:#e94560; font-size:24px;">0</span></p>
        <button class="start-btn" style="padding: 10px 40px;" onclick="location.reload()">LÀM LẠI CUỘC ĐỜI</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d');
        const bgm = new Audio('bgm.mp3'); bgm.loop = true; bgm.volume = 0.15;
        const killSounds = ['kill1.mp3', 'kill2.mp3', 'kill3.mp3', 'kill4.mp3', 'kill5.mp3'];
        function playSFX(s, v=1.0) { let a = new Audio(s); a.volume = v; a.play().catch(()=>{}); }

        const botNames = ["Boy Phố", "Báo Thủ", "Lươn Chúa", "Đại Ca Mõm", "Chúa Tể Ăn Hôi", "Trẻ Trâu", "Simp Lỏ", "Chiến Thần", "Kẻ Hủy Diệt", "Mỏ Hỗn"];
        const wallTaunts = ["Mù à đâm tường? Thay kính đi em!", "Tường ngon không? Nhai kỹ vào!", "Lái ngu vầy thì đi bộ cho nó lành sếp ơi.", "Mắt để ở mông hay sao mà lái thế?"];
        const killTaunts = ["Bị {name} vả cho sang chấn tâm lý!", "Quỳ xuống gọi {name} là bố đi con trai.", "Trình này đi chăn vịt đi, tuổi gì với {name}!", "Bị {name} nó nhét hành ngập mõm kìa!"];

        let player, bots = [], foods = [], projectiles = [];
        let gameState = 'menu', worldSize = 3500, camera = {x:0, y:0}, zoom = 1, shake = 0, shakeMag = 0, isCheat = false;

        const tiers = [
            { min: 0, color: '#2ecc71', aura: 'rgba(46, 204, 113, 0.3)', label: 'CẤP 1' },
            { min: 1000, color: '#3498db', aura: 'rgba(52, 152, 219, 0.5)', label: 'CẤP 2' },
            { min: 5000, color: '#f1c40f', aura: 'rgba(241, 196, 15, 0.7)', label: 'CẤP 3' }
        ];
        function getTier(s) { return s < 1000 ? tiers[0] : (s < 5000 ? tiers[1] : tiers[2]); }

        class Snake {
            constructor(name, isP, x, y, color, emoji) {
                this.name = name; this.isP = isP; this.x = x; this.y = y; this.color = color; this.emoji = emoji;
                this.score = 60; this.size = 15; this.angle = Math.random()*Math.PI*2; this.segments = [];
                this.hp = 100; this.maxHp = 100; this.dash = 0; this.shootCD = 0;
                for(let i=0; i<20; i++) this.segments.push({x:x, y:y});
            }
            update() {
                this.size = 15 + Math.sqrt(this.score)*0.4;
                let speed = (this.dash > 0 ? 11 : 4.5) * (this.isP && isCheat ? 1.6 : 1);
                this.x += Math.cos(this.angle) * speed; this.y += Math.sin(this.angle) * speed;
                
                // MỘT BƯỚC ĐỂ LÀM THÂN RẮN LIỀN MẠCH NHƯ CŨ
                let head = {x: this.x, y: this.y};
                let last = this.segments[0];
                let dist = Math.hypot(head.x - last.x, head.y - last.y);
                if(dist > this.size * 0.4) {
                    this.segments.unshift(head);
                    let targetLen = Math.floor(this.score/6) + 15;
                    while(this.segments.length > targetLen) this.segments.pop();
                }
                if(this.dash > 0) this.dash--;
                if(this.shootCD > 0) this.shootCD--;
            }
            draw() {
                let t = getTier(this.score);
                ctx.save();
                // Vẽ thân rắn kiểu modal cũ (liền mạch)
                this.segments.forEach((seg, i) => {
                    ctx.globalAlpha = 1 - (i/this.segments.length)*0.8;
                    ctx.fillStyle = this.color;
                    if(this.score > 1000) { ctx.shadowBlur = 10; ctx.shadowColor = t.color; }
                    ctx.beginPath(); ctx.arc(seg.x, seg.y, this.size * (1 - i/this.segments.length*0.5), 0, Math.PI*2); ctx.fill();
                });
                ctx.restore();
                // Vẽ đầu và tên
                ctx.font = (this.size*1.3)+"px Arial"; ctx.textAlign='center';
                ctx.fillText(this.emoji, this.x, this.y + this.size/2);
                ctx.font = "bold 13px Segoe UI"; ctx.fillStyle='white'; 
                ctx.fillText(this.name + " ("+Math.floor(this.score)+")", this.x, this.y - this.size - 12);
            }
        }

        function spawnBot() { bots.push(new Snake(botNames[Math.floor(Math.random()*botNames.length)], false, (Math.random()-0.5)*worldSize, (Math.random()-0.5)*worldSize, "hsl("+Math.random()*360+",70%,50%)", "🐍")); }
        function spawnFood() { foods.push({x:(Math.random()-0.5)*worldSize, y:(Math.random()-0.5)*worldSize, s:Math.random()*4+4, c:"hsl("+Math.random()*360+",80%,60%)"}); }

        function startGame() {
            isCheat = document.getElementById('cheat-input').value.toLowerCase() === "ducdeptrais1tg";
            player = new Snake(document.getElementById('player-name').value || "Đức Pro", true, 0, 0, "#3498db", "😎");
            bots = []; for(let i=0; i<50; i++) spawnBot();
            foods = []; for(let i=0; i<400; i++) spawnFood();
            document.getElementById('menu-screen').style.display='none';
            document.getElementById('ui').style.display='block';
            document.getElementById('leaderboard').style.display='block';
            document.getElementById('boost-container').style.display='block';
            if('ontouchstart' in window) { document.getElementById('joystick-zone').style.display='block'; document.getElementById('mobile-controls').style.display='flex'; }
            bgm.play().catch(()=>{}); gameState = 'playing';
        }

        function shoot(s) {
            if(s.shootCD > 0 && !isCheat) return;
            if(s.score < 100 && !isCheat) return;
            if(!isCheat) s.score -= 100;
            s.shootCD = isCheat ? 4 : 45;
            if(s.isP) playSFX('shoot.mp3', 1.0);
            projectiles.push({x: s.x, y: s.y, a: s.angle, owner: s, life: 100});
        }

        // --- JOYSTICK LOGIC ---
        let joyActive = false, joyKnob = document.getElementById('joystick-knob');
        document.getElementById('joystick-zone').ontouchstart = () => joyActive = true;
        window.ontouchmove = (e) => {
            if(!joyActive || !player) return;
            let touch = e.touches[0]; let rect = document.getElementById('joystick-base').getBoundingClientRect();
            let dx = touch.clientX - (rect.left + 50), dy = touch.clientY - (rect.top + 50);
            let dist = Math.sqrt(dx*dx+dy*dy);
            let angle = Math.atan2(dy, dx);
            let lim = Math.min(dist, 35);
            joyKnob.style.transform = `translate(calc(-50% + ${Math.cos(angle)*lim}px), calc(-50% + ${Math.sin(angle)*lim}px))`;
            player.angle = angle;
        };
        window.ontouchend = () => { joyActive = false; joyKnob.style.transform = 'translate(-50%, -50%)'; };

        // Mouse & Keys
        window.onmousemove = (e) => { if(gameState==='playing') player.angle = Math.atan2(e.clientY - canvas.height/2, e.clientX - canvas.width/2); };
        window.onkeydown = (e) => { if(e.code==='Space') player.dash=20; if(e.key==='q') shoot(player); };
        document.getElementById('btn-fire').ontouchstart = () => shoot(player);
        document.getElementById('btn-dash').ontouchstart = () => player.dash=25;

        function loop() {
            requestAnimationFrame(loop);
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            if(gameState !== 'playing') return;

            player.update();
            camera.x = player.x; camera.y = player.y;

            // Update Bots
            bots.forEach(b => {
                b.update();
                if(Math.random()<0.02) b.angle += (Math.random()-0.5)*2;
                if(Math.hypot(player.x-b.x, player.y-b.y) < 400 && Math.random()<0.015) shoot(b);
            });

            // Food collision
            foods.forEach((f, i) => {
                if(Math.hypot(player.x-f.x, player.y-f.y) < player.size + f.s) { player.score += 10; foods.splice(i,1); spawnFood(); document.getElementById('score').innerText = Math.floor(player.score); }
            });

            // Bullet collision
            projectiles.forEach((p, i) => {
                p.x += Math.cos(p.a)*22; p.y += Math.sin(p.a)*22; p.life--;
                [player, ...bots].forEach(s => {
                    if(s === p.owner || s.dead) return;
                    if(Math.hypot(p.x-s.x, p.y-s.y) < s.size + 10) {
                        s.hp -= 40; p.life = 0;
                        if(p.owner.isP) { shake=10; shakeMag=8; }
                        if(s.hp <= 0) {
                            s.dead = true;
                            if(s.isP) die(p.owner.name);
                            else if(p.owner.isP) { 
                                playSFX(killSounds[Math.floor(Math.random()*5)], 1.0); 
                                player.score+=350; shake=20; shakeMag=15; 
                            }
                        }
                    }
                });
                if(p.life <= 0) projectiles.splice(i,1);
            });

            // Head to Body collision (Tạt đầu)
            bots.forEach(b => {
                if(Math.hypot(player.x-b.x, player.y-b.y) < player.size + b.size) {
                    if(Math.random()>0.5) die(b.name);
                    else { b.dead=true; playSFX(killSounds[Math.floor(Math.random()*5)], 1.0); player.score+=600; shake=20; shakeMag=15; }
                }
            });

            // Wall check
            if(Math.abs(player.x) > worldSize/2 || Math.abs(player.y) > worldSize/2) die(null);

            // UI Cấp độ
            let t = getTier(player.score);
            document.getElementById('boost-bar').style.width = (player.score % 1000)/10 + "%";
            document.getElementById('boost-bar').style.background = t.color;

            // Leaderboard
            let sorted = [player, ...bots].sort((a,b)=>b.score-a.score).slice(0,5);
            document.getElementById('lb-content').innerHTML = sorted.map((s,i)=>`<div style="color:${s.isP?'#f1c40f':'white'}">#${i+1} ${s.name}: ${Math.floor(s.score)}</div>`).join('');

            draw();
        }

        function die(k) {
            gameState = 'over'; bgm.pause(); playSFX('die.mp3', 1.0);
            document.getElementById('game-over-screen').style.display='flex';
            document.getElementById('death-text').innerText = k ? killTaunts[Math.floor(Math.random()*killTaunts.length)].replace(/{name}/g, k) : wallTaunts[Math.floor(Math.random()*wallTaunts.length)];
            document.getElementById('final-score').innerText = Math.floor(player.score);
        }

        function draw() {
            ctx.fillStyle = '#0b0c10'; ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.save();
            if(shake > 0) { ctx.translate((Math.random()-0.5)*shakeMag, (Math.random()-0.5)*shakeMag); shake--; }
            ctx.translate(canvas.width/2 - camera.x, canvas.height/2 - camera.y);

            // Grid
            ctx.strokeStyle = '#222'; ctx.lineWidth = 1;
            for(let i=-worldSize/2; i<=worldSize/2; i+=150) { ctx.beginPath(); ctx.moveTo(i,-worldSize/2); ctx.lineTo(i,worldSize/2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-worldSize/2,i); ctx.lineTo(worldSize/2,i); ctx.stroke(); }
            
            // Wall
            ctx.strokeStyle = '#e94560'; ctx.lineWidth = 15;
            ctx.strokeRect(-worldSize/2, -worldSize/2, worldSize, worldSize);

            foods.forEach(f => { ctx.fillStyle = f.c; ctx.beginPath(); ctx.arc(f.x, f.y, f.s, 0, Math.PI*2); ctx.fill(); });
            projectiles.forEach(p => { ctx.fillStyle = '#00ffff'; ctx.beginPath(); ctx.arc(p.x, p.y, 8, 0, Math.PI*2); ctx.fill(); });
            [...bots, player].forEach(s => { if(!s.dead) s.draw(); });
            ctx.restore();
        }
        loop();
    </script>
</body>
</html>
